<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Nền galaxy tím vàng -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d0020"/>
      <stop offset="45%"  stop-color="#2d0a5c"/>
      <stop offset="100%" stop-color="#5a1080"/>
    </linearGradient>
    <!-- Ribbon vàng -->
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#b8860b"/>
      <stop offset="30%"  stop-color="#ffd700"/>
      <stop offset="60%"  stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <!-- CTA button -->
    <linearGradient id="cta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <!-- Vầng sáng vàng -->
    <radialGradient id="halo" cx="50%" cy="38%" r="35%">
      <stop offset="0%"   stop-color="#ffe066" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
    <!-- Accent strip trái -->
    <linearGradient id="strip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffd700" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="textglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Nền chính -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Halo vàng trung tâm -->
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Các ngôi sao -->
  <g opacity="0.85">
    <circle cx="80"  cy="45"  r="2.5" fill="#fffde7"/>
    <circle cx="210" cy="90"  r="1.8" fill="#fff9c4"/>
    <circle cx="380" cy="30"  r="3"   fill="#fffde7"/>
    <circle cx="500" cy="70"  r="1.5" fill="#fff"/>
    <circle cx="650" cy="25"  r="2.2" fill="#fffde7"/>
    <circle cx="780" cy="55"  r="1.8" fill="#fff9c4"/>
    <circle cx="920" cy="35"  r="2.5" fill="#fffde7"/>
    <circle cx="1050"cy="80"  r="2"   fill="#fff"/>
    <circle cx="1130"cy="40"  r="1.5" fill="#fffde7"/>
    <circle cx="140" cy="180" r="1.8" fill="#fff9c4"/>
    <circle cx="310" cy="150" r="2.5" fill="#fffde7"/>
    <circle cx="460" cy="130" r="1.5" fill="#fff"/>
    <circle cx="740" cy="140" r="2"   fill="#fffde7"/>
    <circle cx="880" cy="120" r="1.8" fill="#fff9c4"/>
    <circle cx="1020"cy="160" r="2.5" fill="#fffde7"/>
    <circle cx="50"  cy="300" r="1.5" fill="#fff"/>
    <circle cx="200" cy="350" r="2.2" fill="#fffde7"/>
    <circle cx="1100"cy="320" r="1.8" fill="#fff9c4"/>
    <circle cx="1160"cy="250" r="2.5" fill="#fffde7"/>
    <circle cx="90"  cy="500" r="1.5" fill="#fff"/>
    <circle cx="250" cy="560" r="2"   fill="#fffde7"/>
    <circle cx="980" cy="540" r="1.8" fill="#fff9c4"/>
    <circle cx="1140"cy="490" r="2.2" fill="#fffde7"/>
  </g>

  <!-- Accent strip trái vàng -->
  <rect x="0" y="0" width="10" height="630" fill="url(#strip)"/>

  <!-- Các emoji thẻ bài trang trí (góc phải) -->
  <text x="980" y="130"  font-size="80" opacity="0.18" transform="rotate(-15 980 130)">👑</text>
  <text x="1050" y="250" font-size="65" opacity="0.15" transform="rotate(10 1050 250)">💎</text>
  <text x="960"  y="370" font-size="70" opacity="0.18" transform="rotate(-8 960 370)">🏆</text>
  <text x="1070" y="470" font-size="60" opacity="0.14" transform="rotate(12 1070 470)">⭐</text>
  <text x="940"  y="570" font-size="65" opacity="0.15" transform="rotate(-5 940 570)">🔥</text>

  <!-- Vương miện lớn trung tâm phía trên -->
  <text x="600" y="175" font-size="110" text-anchor="middle"
        filter="url(#glow)" opacity="0.95">👑</text>

  <!-- Logo game -->
  <text x="60" y="80" font-family="Arial Black,Arial,sans-serif"
        font-size="52" font-weight="900" fill="#ffd700"
        filter="url(#textglow)" letter-spacing="1">SIÊU GHÉP THẺ</text>

  <!-- Tagline nhỏ dưới logo -->
  <text x="62" y="112" font-family="Arial,sans-serif"
        font-size="22" fill="rgba(255,255,255,0.65)">🎮  game-ghep-the-vui.blogspot.com</text>

  <!-- Ribbon level name -->
  <rect x="0" y="232" width="1200" height="82" fill="url(#ribbon)" opacity="0.95"/>
  <!-- Viền ribbon trên dưới -->
  <rect x="0" y="232" width="1200" height="4" fill="#fff" opacity="0.4"/>
  <rect x="0" y="310" width="1200" height="4" fill="#fff" opacity="0.4"/>

  <text x="600" y="289" font-family="Arial Black,Arial,sans-serif"
        font-size="46" font-weight="900" fill="#1a0030"
        text-anchor="middle" filter="url(#shadow)" letter-spacing="2">
        MÀN 7: HUYỀN THOẠI  👑
  </text>

  <!-- Sub-label độ hiếm -->
  <text x="600" y="345" font-family="Arial,sans-serif"
        font-size="26" fill="#ffe066" text-anchor="middle"
        filter="url(#textglow)">
    ✦  0.1% — KHÔNG THỂ CHINH PHỤC???  ✦
  </text>

  <!-- Panel thống kê -->
  <rect x="60" y="375" width="740" height="82" rx="16"
        fill="rgba(0,0,0,0.42)"/>

  <!-- Stat: Độ hiếm -->
  <text x="130" y="402" font-family="Arial,sans-serif" font-size="17"
        fill="rgba(255,255,255,0.6)">ĐỘ HIẾM</text>
  <text x="130" y="435" font-family="Arial Black,Arial,sans-serif"
        font-size="26" font-weight="900" fill="#ffd700"
        filter="url(#textglow)">HUYỀN THOẠI</text>

  <!-- Stat: Thử thách -->
  <text x="370" y="402" font-family="Arial,sans-serif" font-size="17"
        fill="rgba(255,255,255,0.6)">THỬ THÁCH</text>
  <text x="370" y="435" font-family="Arial Black,Arial,sans-serif"
        font-size="26" font-weight="900" fill="#ffffff">5 Tầng thẻ</text>

  <!-- Stat: Người vượt -->
  <text x="570" y="402" font-family="Arial,sans-serif" font-size="17"
        fill="rgba(255,255,255,0.6)">NGƯỜI VƯỢT QUA</text>
  <text x="570" y="435" font-family="Arial Black,Arial,sans-serif"
        font-size="26" font-weight="900" fill="#ff6b6b">0.1%</text>

  <!-- CTA Button -->
  <rect x="300" y="482" width="600" height="78" rx="22"
        fill="url(#cta)" filter="url(#shadow)"/>
  <!-- Viền trắng mỏng -->
  <rect x="302" y="484" width="596" height="74" rx="21"
        fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <text x="600" y="531" font-family="Arial Black,Arial,sans-serif"
        font-size="30" font-weight="900" fill="#ffffff"
        text-anchor="middle" filter="url(#shadow)">
    🎮  CHƠI NGAY MIỄN PHÍ!
  </text>

  <!-- URL dưới cùng -->
  <text x="600" y="606" font-family="Arial,sans-serif" font-size="20"
        fill="rgba(255,255,255,0.55)" text-anchor="middle">
    👉  game-ghep-the-vui.blogspot.com
  </text>
</svg>